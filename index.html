<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanji Study Hub — Level 7 Mock Exam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
      --radius-md: 8px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0 0 48px 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Top Navigation Bar */
    .app-topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    header {
      max-width: 1140px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #3b82f6);
      color: #fff;
      font-family: "Noto Serif JP", serif;
      font-size: 1.25rem;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(29, 78, 216, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-sub {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-subtle);
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f8fafc;
      padding: 4px 8px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .controls label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
    }

    select, button {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: var(--radius-md);
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    select {
      padding: 6px 10px;
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
    }

    select:hover, select:focus {
      background-color: #ffffff;
      border-color: var(--border-strong);
      outline: none;
    }

    button {
      padding: 8px 14px;
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    button:hover:not(:disabled) {
      background-color: #f8fafc;
      border-color: #94a3b8;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Primary & Accent Action Buttons */
    #mock-btn, #regenerate-btn, #print-btn {
      background-color: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }

    #mock-btn:hover:not(:disabled),
    #regenerate-btn:hover:not(:disabled),
    #print-btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    #toggle-furigana[aria-pressed="true"] {
      background-color: var(--primary-light);
      color: var(--primary);
      border-color: #93c5fd;
    }

    /* Main Content Container & Status Banner */
    .page-shell {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    #status {
      max-width: 1140px;
      margin: 0 auto 20px;
      padding: 10px 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    /* Kanji Study Grid */
    .kanji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1140px;
      margin: 0 auto;
    }

    .kanji-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .kanji-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .kanji-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .kanji-main {
      font-family: "Noto Serif JP", "Yu Mincho", serif;
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--primary);
    }

    .kanji-meaning {
      font-size: 0.875rem;
      color: var(--text-subtle);
      font-weight: 600;
      background: #f8fafc;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* Step 1-25 Flip Cards */
    .step-flip-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .step-flip-card .kanji-header {
      margin: 0 20px;
      padding-top: 18px;
    }

    .step-face {
      padding: 16px 20px 20px;
      flex: 1;
    }

    .step-face[hidden] {
      display: none !important;
    }

    .step-card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0;
    }

    .step-card-actions button {
      font-size: 0.82rem;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      font-weight: 600;
      border: none;
    }

    .step-card-actions .flip-button {
      background: #1e293b;
      color: #ffffff;
    }

    .step-card-actions .flip-button:hover {
      background: #0f172a;
    }

    .step-card-actions .reading-button {
      background: var(--accent);
      color: #ffffff;
    }

    .step-card-actions .reading-button:hover {
      background: var(--accent-hover);
    }

    .step-card-actions button:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 2px;
    }

    .step-book-words {
      list-style: none;
      padding: 0;
      margin: 10px 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
      gap: 8px;
    }

    .step-book-words li {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #f8fafc;
      min-width: 0;
      overflow-wrap: anywhere;
      transition: background-color 0.15s ease;
    }

    .step-book-words li:hover {
      background: var(--primary-light);
      border-color: #bfdbfe;
    }

    .step-book-words ruby {
      font-size: 1.05rem;
      ruby-position: over;
      font-weight: 500;
    }

    .step-book-words rt {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .step-book-words .reading-unavailable {
      font-size: 0.75rem;
      color: var(--text-subtle);
    }

    .step-card-help {
      font-size: 0.76rem;
      color: var(--text-subtle);
      margin-top: 8px;
    }

    /* Standard Vocabulary List */
    .vocab-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .vocab-item {
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
      display: flex;
      justify-content: space-between;
      padding: 9px 4px;
      border-bottom: 1px dashed var(--border);
    }

    .vocab-item:last-child {
      border-bottom: none;
    }

    ruby {
      font-size: 1.15rem;
      font-family: "Noto Sans JP", sans-serif;
    }

    rt {
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .hide-reading rt {
      visibility: hidden;
    }

    /* Collapsible Study Book & Dictionary Details */
    .studybook-details, .dictionary-details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0 0;
      background: #f8fafc;
    }

    .studybook-details summary, .dictionary-details summary {
      font-weight: 600;
      font-size: 0.86rem;
      color: var(--text);
      cursor: pointer;
      line-height: 1.5;
    }

    .studybook-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin: 12px 0;
      font-size: 0.88rem;
      background: #ffffff;
      padding: 10px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .studybook-meaning {
      margin: 10px 0;
      line-height: 1.6;
      font-size: 0.9rem;
    }

    .studybook-words ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px 14px;
      margin: 8px 0;
      padding-left: 20px;
    }

    .studybook-words li {
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .studybook-details small {
      color: var(--text-subtle);
      line-height: 1.5;
      display: block;
      margin-top: 10px;
    }

    /* Mock Test Toolbar & Answer Key */
    .mock-toolbar {
      max-width: 1140px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .mock-toolbar span {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: auto;
    }

    #mock-answers {
      max-width: 1140px;
      margin: 20px auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .key-grid section {
      break-inside: avoid;
      background: #f8fafc;
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .key-grid p {
      font-size: 0.88rem;
      line-height: 1.65;
      margin: 0;
    }

    /* --- UNTOUCHED EXAM PAPER & SVG RENDERER GEOMETRY --- */
    .exam-page{box-sizing:border-box;max-width:1100px;min-height:740px;margin:16px auto;padding:22px 30px;background:#fff;border:1px solid #aeb7c5;box-shadow:0 2px 8px #0001;color:#111;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
    .exam-head{display:flex;justify-content:space-between;align-items:start;border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:12px;gap:12px}
    .exam-head h2{margin:0;font-size:1.2rem}.exam-head small{font-size:.75rem}
    .exam-meta{display:flex;gap:15px;font-size:.8rem;flex-wrap:wrap}.exam-meta span{border-bottom:1px solid #444;min-width:110px}
    .exam-sections{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
    .exam-section{border:1px solid #aaa;padding:9px;min-width:0}.exam-section h3{font-size:.9rem;margin:0 0 7px;border-bottom:1px solid #aaa;padding-bottom:5px}
    .exam-section p{font-size:.74rem;margin:0 0 9px;line-height:1.45}
    .exam-questions{margin:0;padding:0;list-style:none}.exam-questions li{font-size:.85rem;line-height:1.6;margin-bottom:8px;overflow-wrap:anywhere;break-inside:avoid}
    .exam-questions .num{font-size:.7rem;color:#555;margin-right:4px}.answer-space{display:block;height:20px;border-bottom:1px solid #888;margin-top:2px}
    .exam-questions .choices{font-size:.75rem;color:#333}.exam-questions ruby rt{font-size:.6em}

    [hidden]{display:none!important}
    .japanese-paper{box-sizing:border-box;width:283mm;height:196mm;min-height:0!important;display:grid!important;grid-template-columns:minmax(0,1fr) 26mm;gap:3mm;padding:4mm!important;background:white;color:#111;overflow:hidden;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif}
    .exam-side{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;gap:2.5mm;border-left:1px solid #888;padding-left:2mm;min-width:0;font-family:inherit}
    .exam-side strong{border:1.5px solid #111;padding:1mm 2mm;font-size:19px;line-height:1.2}
    .exam-side>span{writing-mode:vertical-rl;letter-spacing:.12em;font-size:17px;font-weight:bold;max-height:85mm}
    .exam-side small{font-size:9px;writing-mode:vertical-rl;max-height:25mm}
    .exam-side label{writing-mode:vertical-rl;font-size:11px;max-height:42mm;border:1px solid #999;padding:2mm}
    .vertical-sheet{grid-column:1;grid-row:1;min-width:0;display:grid;grid-template-rows:1fr 1.08fr;gap:1.5mm;direction:rtl}
    .vertical-sheet.page-two{grid-template-rows:.9fr .9fr 1.1fr}
    .exam-band{display:flex;flex-direction:row;direction:rtl;min-width:0;min-height:0;gap:1.2mm;border-bottom:1px solid #aaa;padding-bottom:1mm}
    .exam-band:last-child{border-bottom:0}
    .vertical-section{box-sizing:border-box;writing-mode:vertical-rl;text-orientation:mixed;flex:1 1 0;min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1mm;border-left:1px solid #bbb;padding:1mm;font-family:inherit}
    .vertical-section:last-child{border-left:0}
    .section-title{font-size:12px;font-weight:700;border-right:3px solid #222;padding-right:1mm;white-space:nowrap;line-height:1.1}
    .section-title small{font-size:8px}
    .section-instruction{font-size:8.2px;line-height:1.2;max-height:100%;white-space:normal}
    .vertical-questions{display:flex;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:1mm;min-width:0;min-height:0;overflow:hidden}
    .exam-question{writing-mode:vertical-rl;display:flex;align-items:center;gap:1mm;font-size:9px;line-height:1.2;max-height:100%;min-width:4mm;border-left:0;padding-left:.5mm}
    .qnumber{font-size:8px;color:#333}.qprompt{max-height:100%;overflow-wrap:anywhere}
    .writebox{display:inline-block;width:5.5mm;height:7mm;border:1px solid #555;flex-shrink:0}
    .choices{font-size:7.5px;display:block;margin-top:1mm}
    .mock-disclaimer{font-size:8px;border:1px solid #888;padding:1mm;writing-mode:vertical-rl}

    /* Renderer V4: identical SVG geometry on screen and paper */
    #mock-paper{display:flex;flex-direction:column;align-items:center;gap:20px;overflow-x:auto;padding:8px 0;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
    .exam-canvas{width:297mm;height:210mm;flex:none;background:white;box-shadow:0 4px 20px rgba(15, 23, 42, 0.12);border-radius:4px;box-sizing:border-box}
    .exam-svg{display:block;width:100%;height:100%;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif;color:#111}

    #mobile-screen-paper{display:none}
    .mobile-screen-sheet{background:#fff;aspect-ratio:561 / 794;width:100%;overflow:hidden;box-shadow:0 2px 9px #0002;border:1px solid #d8dee8;position:relative;border-radius:6px}
    .mobile-screen-sheet svg{display:block;width:100%;height:100%;font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif CJK JP",serif}
    .mobile-sheet-label{font:600 12px "Inter",system-ui,sans-serif;color:#334155;margin:0 0 5px}
    #mobile-exam-tip{display:none;font-size:.88rem;color:#475569;margin:0 auto 12px;max-width:1100px;background:#fff;padding:10px 14px;border-radius:8px;border:1px solid var(--border)}
    #mobile-print-paper{display:none}

    /* Responsive Breakpoints */
    @media screen and (max-width: 1100px) {
      .japanese-paper { min-width: 1069px; }
      .exam-page { overflow-x: auto; }
    }

    @media screen and (max-width: 800px) {
      .exam-sections { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .exam-page { min-height: 0; }
      .key-grid { grid-template-columns: 1fr; }
    }

    @media screen and (max-width: 700px) {
      .app-topbar { padding: 12px; }
      .page-shell { padding: 0 12px; }
      header { gap: 12px; }
      h1 { font-size: 1.15rem; }
      .controls {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .control-group {
        width: 100%;
        justify-content: space-between;
      }
      .controls button, .controls select {
        min-height: 42px;
        min-width: 0;
        font-size: 0.82rem;
        padding: 8px;
      }
      .kanji-grid {
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr));
        gap: 14px;
      }
      .kanji-card { padding: 16px; }
      .step-book-words { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .studybook-meta { grid-template-columns: 1fr 1fr; }
      .studybook-words ul { grid-template-columns: 1fr 1fr; }
      .mock-toolbar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-bottom: 12px;
      }
      .mock-toolbar button {
        min-height: 42px;
        padding: 8px;
        font-size: 0.82rem;
      }
      .mock-toolbar #mock-info {
        grid-column: 1 / -1;
        margin-left: 0;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      #mobile-exam-tip { display: block; }
      #mobile-screen-paper {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 600px;
        margin: 0 auto 20px;
      }
      #mock-paper {
        display: none;
        align-items: flex-start;
        gap: 12px;
        scroll-snap-type: x proximity;
      }
      #mock-panel.landscape-screen #mobile-screen-paper { display: none; }
      #mock-panel.landscape-screen #mock-paper { display: flex; }
      #mock-panel.landscape-screen #mock-paper .exam-canvas { width: 900px; }
      #mock-panel.landscape-screen.fit-pages #mock-paper .exam-canvas { width: calc(100vw - 24px); }
      .exam-canvas {
        width: 900px;
        height: auto;
        aspect-ratio: 1122 / 794;
        scroll-snap-align: start;
      }
      #mock-panel.fit-pages .exam-canvas { width: calc(100vw - 24px); }
      #mock-answers { padding: 16px; }
    }

    @media screen and (min-width: 701px) {
      #mobile-view-btn { display: none; }
    }

    /* Print Styles */
    @page { size: A4 landscape; margin: 0; }
    @media print {
      html, body { margin: 0 !important; padding: 0 !important; background: white !important; }
      .app-topbar, header, #status, #kanji-container, .mock-toolbar,
      #mobile-exam-tip, #mobile-view-btn, #mobile-print-paper, #mobile-screen-paper {
        display: none !important;
      }
      #mock-panel { display: block !important; }
      #mock-paper { display: block !important; padding: 0 !important; margin: 0 !important; overflow: visible !important; }
      .exam-canvas {
        width: 297mm !important;
        height: 210mm !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        break-after: page;
        page-break-after: always;
        overflow: hidden !important;
      }
      .exam-canvas:last-child { break-after: auto; page-break-after: auto; }
      .japanese-paper {
        width: 283mm !important;
        height: 196mm !important;
        min-width: 0 !important;
        margin: 0 !important;
        break-after: page !important;
        border: 0 !important;
        box-shadow: none !important;
      }
      .exam-page:last-of-type { break-after: auto !important; }
      #mock-answers { display: none !important; }
      body.mobile-pdf-print #mock-paper { display: none !important; }
      body.mobile-pdf-print #mobile-print-paper { display: block !important; }
